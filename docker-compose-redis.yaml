# 서비스 정의
services:
  redis:
    image: redis:7.2-alpine
    container_name: redis
    expose:
      - 6379
    ports:  # (개발용)DataGrip 확인용 포트
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - backend

networks:
  backend:

volumes:
  redis-data:

# 실행: docker compose -f docker-compose-redis.yaml up -d